<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -159.61 244 183.21" width="244" height="183.21" role="img" aria-label="Persegi panjang ABCD dengan A di kiri bawah, B di kanan bawah, C di kanan atas, dan D di kiri atas. Titik P di dalamnya, lebih dekat ke sisi kiri dan sedikit di atas pertengahan tinggi. Segitiga PAB yang beralas sisi bawah dan segitiga PCD yang beralas sisi atas keduanya diarsir"><title>Persegi panjang ABCD dengan A di kiri bawah, B di kanan bawah, C di kanan atas, dan D di kiri atas. Titik P di dalamnya, lebih dekat ke sisi kiri dan sedikit di atas pertengahan tinggi. Segitiga PAB yang beralas sisi bawah dan segitiga PCD yang beralas sisi atas keduanya diarsir</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="a" points="74.8,-85 204,-136 0,-136"/><polygon class="a" points="74.8,-85 0,0 204,0"/><polygon class="g" points="0,0 204,0 204,-136 0,-136"/><line class="g bantu" x1="74.8" y1="-85" x2="0" y2="0"/><line class="g bantu" x1="74.8" y1="-85" x2="204" y2="0"/><line class="g bantu" x1="74.8" y1="-85" x2="204" y2="-136"/><line class="g bantu" x1="74.8" y1="-85" x2="0" y2="-136"/><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-10.61" y="10.61">A</