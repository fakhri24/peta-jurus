<svg xmlns="http://www.w3.org/2000/svg" viewBox="-124.96 -122 249.92 244" width="249.92" height="244" role="img" aria-label="Lingkaran berpusat O dengan AB sebagai diameter mendatar, A di kiri dan B di kanan. Titik C terletak di keliling lingkaran di atas AB. Tali busur AC dan CB digambar, begitu pula jari-jari OC. Sudut CAB besarnya 32 derajat, dan sudut COB yang ditanyakan"><title>Lingkaran berpusat O dengan AB sebagai diameter mendatar, A di kiri dan B di kanan. Titik C terletak di keliling lingkaran di atas AB. Tali busur AC dan CB digambar, begitu pula jari-jari OC. Sudut CAB besarnya 32 derajat, dan sudut COB yang ditanyakan</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><circle class="g bantu" cx="0" cy="0" r="102"/><line class="g" x1="-102" y1="0" x2="102" y2="0"/><polygon class="g" points="-102,0 102,0 44.71,-91.68"/><line class="g bantu" x1="0" y1="0" x2="44.71" y2="-91.68"/><path class="g" d="M-82 0A20 20 0 0 0 -85.04 -10.6"/><text class="t ukur" x="-61.63" y="-11.58">32°</text><path class="g" d="M20 0A20 20 0 0 0 8.77 -17.98"/><text class="t ukur" x="27.14" y="-16.96">?</text><circle class="n" cx="-102" cy="0" r="2.6"/><text class="t" x="-116.71" y="2.94">A</text><circle class="n"