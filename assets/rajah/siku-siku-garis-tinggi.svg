<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22.62 -130 266.23 158" width="266.23" height="158" role="img" aria-label="Segitiga ABC siku-siku di C, dengan sisi miring AB mendatar. Dari C ditarik garis tinggi yang memotong sisi miring tegak lurus di titik D, membagi AB menjadi potongan AD yang pendek dan DB yang lebih panjang"><title>Segitiga ABC siku-siku di C, dengan sisi miring AB mendatar. Dari C ditarik garis tinggi yang memotong sisi miring tegak lurus di titik D, membagi AB menjadi potongan AD yang pendek dan DB yang lebih panjang</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="g" points="0,0 221,0 68,-102"/><line class="g bantu" x1="68" y1="-102" x2="68" y2="0"/><polyline class="g" points="61.9,-92.85 71.05,-86.75 77.15,-95.9"/><polyline class="g" points="57,0 57,-11 68,-11"/><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-14.37" y="4.31">A</text><circle class="n" cx="221" cy="0" r="2.6"/><text class="t" x="235.37" y="4.31">B</text><circle class="n" cx="68" cy="-102" r="2.6"/><text class="t" x="68" y="-117">C</text><circle class="n" cx="68" cy="0" r="2.6"/><text class="t" x="68" y="15">D</text></svg>
