<svg xmlns="http://www.w3.org/2000/svg" viewBox="-58.08 -117.2 311.32 146.2" width="311.32" height="146.2" role="img" aria-label="Sebuah garis lurus mendatar bernama l. Di atasnya ada titik A di kiri, berjarak 2 dari garis itu, dan titik B di kanan, berjarak 4 dari garis itu. Kedua kaki tegak lurusnya pada garis l berjarak 8 satu sama lain. Sebuah titik P berada pada garis l di antara kedua kaki itu, dan lintasan patah dari A ke P lalu ke B digambar putus-putus"><title>Sebuah garis lurus mendatar bernama l. Di atasnya ada titik A di kiri, berjarak 2 dari garis itu, dan titik B di kanan, berjarak 4 dari garis itu. Kedua kaki tegak lurusnya pada garis l berjarak 8 satu sama lain. Sebuah titik P berada pada garis l di antara kedua kaki itu, dan lintasan patah dari A ke P lalu ke B digambar putus-putus</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><line class="g bantu" x1="-38.08" y1="0" x2="233.24" y2="0"/><line class="g bantu putus" x1="0" y1="-47.6" x2="0" y2="0"/><line class="g bantu putus" x1="190.4" y1="-95.2" x2="190.4" y2="0"/><polyline class="g" points="0,-11 11,-11 11,0"/><polyline class="g" points="190.4,-11 179.4,-11 179.4,0"/><polyline class="g tekan putus" points="0,-47.6 119,0 190