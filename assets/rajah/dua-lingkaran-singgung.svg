<svg xmlns="http://www.w3.org/2000/svg" viewBox="-101.6 -387.2 550 413.06" width="550" height="413.06" role="img" aria-label="Dua lingkaran yang bersinggungan dari luar, yang kecil di kiri dan yang besar di kanan, keduanya menyinggung satu garis mendatar di bawahnya. Titik singgung pada garis itu adalah X untuk lingkaran kecil dan Y untuk lingkaran besar. Kedua pusat dihubungkan oleh ruas yang melewati titik singgung kedua lingkaran, dan tiap jari-jari ke garis mendatar tegak lurus terhadapnya"><title>Dua lingkaran yang bersinggungan dari luar, yang kecil di kiri dan yang besar di kanan, keduanya menyinggung satu garis mendatar di bawahnya. Titik singgung pada garis itu adalah X untuk lingkaran kecil dan Y untuk lingkaran besar. Kedua pusat dihubungkan oleh ruas yang melewati titik singgung kedua lingkaran, dan tiap jari-jari ke garis mendatar tegak lurus terhadapnya</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><circle class="g" cx="0" cy="-81.6" r="81.6"/><circle class="g" cx="244.8" cy="-183.6" r="183.6"/><line class="g bantu" x1="-40.8" y1="0" x2="285.6" y2="0"/><line class="g tekan" x1="0" y1="0" x2="244.8" y2="0"/><line class="g bantu putus" x1="0" y1="-81.6" x2="0" y2="0"/><line class="g bantu putus" x1="244.8" y1="-183.6" x2="244.8" y2="0"/><line class="g bantu" x1="0" y1="-81.6" x2="244.8" y2="-183.6"/><polyline class="g" points="0,-11 11,-11 11,0"/><polyline class="g" points="233.8,0 233.8,-11 244.8,-11"/><circle class="n bantu" cx="0" cy="-81.6" r="2.6"/><text class="t bantu" x="-14.37" y="-85.91">P</text><circle class="n bantu" cx="244.8" cy="-183.6" r="2.6"/><text class="t bantu" x="259.17" y="-187.91">Q</text><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-7.72" y="12.86">X</text><circle class="n" cx="244.8" cy="0" r="2.6"/><text class="t" x="252.52" y="12.86">Y</text><circle class="n bantu" cx="75.32" cy="-112.98" r="2.6"/><text class="t bantu" x="79.63" y="-127.35">S</text></svg>
