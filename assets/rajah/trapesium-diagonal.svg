<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21.11 -129.52 195.22 150.23" width="195.22" height="150.23" role="img" aria-label="Trapesium ABCD dengan sisi AB mendatar di bawah dan sisi DC mendatar di atas, keduanya sejajar dan AB lebih panjang daripada DC. Kedua diagonalnya, AC dan BD, digambar dan berpotongan di titik P"><title>Trapesium ABCD dengan sisi AB mendatar di bawah dan sisi DC mendatar di atas, keduanya sejajar dan AB lebih panjang daripada DC. Kedua diagonalnya, AC dan BD, digambar dan berpotongan di titik P</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="g" points="0,0 153,0 132.6,-108.8 30.6,-108.8"/><line class="g bantu" x1="0" y1="0" x2="132.6" y2="-108.8"/><line class="g bantu" x1="153" y1="0" x2="30.6" y2="-108.8"/><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-12.86" y="7.72">A</text><circle class="n" cx="153" cy="0" r="2.6"/><text class="t" x="165.86" y="7.72">B</text><circle class="n" cx="132.6" cy="-108.8" r="2.6"/><text class="t" x="145.46" y="-116.52">C</text><circle class="n" cx="30.6" cy="-108.8" r="2.6"/><text class="t" x="17.74" y="-116.52">D</text><circle class="n" cx="79.56" cy="-65.28" r="2.6"/><text class="t" x="79.56" y="-80.28">P</text></svg>
