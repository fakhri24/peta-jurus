<svg xmlns="http://www.w3.org/2000/svg" viewBox="-67.6 -130 232.07 158" width="232.07" height="158" role="img" aria-label="Garis l dan garis m sejajar mendatar. Titik B pada garis l dan titik D pada garis m, dengan A pada garis l di sebelah kanan B dan C pada garis m di sebelah kanan D. Titik E terletak di antara kedua garis, dihubungkan ke B dan ke D sehingga membentuk zigzag. Sudut ABE besarnya 42 derajat, sudut CDE besarnya 63 derajat, dan sudut BED yang ditanyakan"><title>Garis l dan garis m sejajar mendatar. Titik B pada garis l dan titik D pada garis m, dengan A pada garis l di sebelah kanan B dan C pada garis m di sebelah kanan D. Titik E terletak di antara kedua garis, dihubungkan ke B dan ke D sehingga membentuk zigzag. Sudut ABE besarnya 42 derajat, sudut CDE besarnya 63 derajat, dan sudut BED yang ditanyakan</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><line class="g" x1="-47.6" y1="0" x2="142.8" y2="0"/><line class="g" x1="-47.6" y1="-102" x2="142.8" y2="-102"/><polyline class="g" points="0,0 50.53,-45.5 21.75,-102"/><path class="g" d="M20 0A20 20 0 0 0 14.86 -13.38"/><text class="t ukur" x="33.61" y="-12.9">42°</text><path class="g" d="M30.83 -84.18A20 20 0 0 0 41.75 -102"/><text class="t ukur" x="52.44" y="-83.19">63°</text><path class="g" d="M41.45 -63.32A20 20 0 0 0 35.67 -32.12"/><text class="t ukur" x="21.04" y="-50.97">?</text><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-6.71" y="13.42">B</text><circle class="n" cx="142.8" cy="0" r="2.6"/><text class="t" x="156.22" y="6.71">A</text><circle class="n" cx="21.75" cy="-102" r="2.6"/><text class="t" x="15.04" y="-115.42">D</text><circle class="n" cx="142.8" cy="-102" r="2.6"/><text class="t" x="156.22" y="-108.71">C</text><circle class="n" cx="50.53" cy="-45.5" r="2.6"/><text class="t" x="65.53" y="-45.5">E</text><text class="t bantu" x="-47.6" y="15">l</text><text class="t bantu" x="-47.6" y="-117">m</text></svg>
