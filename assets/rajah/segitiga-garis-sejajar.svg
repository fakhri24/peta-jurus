<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21.67 -204.8 281.33 224.8" width="281.33" height="224.8" role="img" aria-label="Segitiga ABC dengan alas BC mendatar dan puncak A di atas. Titik D pada sisi AB dan titik E pada sisi AC, dengan ruas DE sejajar alas BC. Ruas AD panjangnya 6, DB panjangnya 4, AE panjangnya 9, dan EC yang ditanyakan"><title>Segitiga ABC dengan alas BC mendatar dan puncak A di atas. Titik D pada sisi AB dan titik E pada sisi AC, dengan ruas DE sejajar alas BC. Ruas AD panjangnya 6, DB panjangnya 4, AE panjangnya 9, dan EC yang ditanyakan</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="g" points="40.8,-176.8 0,0 238,0"/><line class="g tekan" x1="16.32" y1="-70.72" x2="159.12" y2="-70.72"/><text class="t ukur" x="14.92" y="-126.91">6</text><text class="t ukur" x="-5.48" y="-38.51">4</text><text class="t ukur" x="109.31" y="-134.18">9</text><text class="t ukur" x="207.91" y="-45.78">?</text><circle class="n" cx="40.8" cy="-176.8" r="2.6"/><text class="t" x="40.8" y="-191.8">A</text><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-13.42" y="6.71">B</text><circle class="n" cx="238" cy="0" r="2.6"/><text class="t" x="251.42" y="6.71">C</text><circle class="n" cx="16.32" cy="-70.72" r="2.6"/><text class="t" x="1.32" y="-70.72">D</text><circle class="n" cx="159.12" cy="-70.72" r="2.6"/><text class="t" x="173.83" y="-73.66">E</text></svg>
