<svg xmlns="http://www.w3.org/2000/svg" viewBox="-142.59 -150.59 285.18 293.18" width="285.18" height="293.18" role="img" aria-label="Segitiga sama sisi ABC dengan ketiga titik sudutnya pada sebuah lingkaran: A di puncak atas, B di kiri bawah, C di kanan bawah. Titik P berada pada busur BC yang tidak memuat A, lebih dekat ke B daripada ke C. Dari P ditarik ruas ke ketiga titik sudut. Ruas PB panjangnya 2, ruas PC panjangnya 5, dan ruas PA — yang memotong sisi BC — panjangnya belum diketahui dan ditandai tanda tanya"><title>Segitiga sama sisi ABC dengan ketiga titik sudutnya pada sebuah lingkaran: A di puncak atas, B di kiri bawah, C di kanan bawah. Titik P berada pada busur BC yang tidak memuat A, lebih dekat ke B daripada ke C. Dari P ditarik ruas ke ketiga titik sudut. Ruas PB panjangnya 2, ruas PC panjangnya 5, dan ruas PA — yang memotong sisi BC — panjangnya belum diketahui dan ditandai tanda tanya</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><circle class="g bantu" cx="0" cy="0" r="122.59"/><polygon class="g" points="0,-122.59 -106.16,61.29 106.16,61.29"/><line class="g" x1="-47.02" y1="-27.15" x2="-59.14" y2="-34.15"/><line class="g" x1="0" y1="54.29" x2="0" y2="68.29"/><line class="g" x1="47.02" y1="-27.15" x2="59.14" y2="-34.15"/><line class="g tekan" x1="-57.17" y1="108.44" x2="-106.16" y2="61.29"/><line class="g tekan" x1="-57.17" y1="108.44" x2="106.16" y2="61.29"/><line class="g tekan putus" x1="-57.17" y1="108.44" x2="0" y2="-122.59"/><text class="t ukur" x="-91.37" y="94.96">2</text><text class="t ukur" x="28.38" y="98.32">5</text><text class="t ukur" x="-1.3" y="-60.84">?</text><circle class="n" cx="0" cy="-122.59" r="2.6"/><text class="t" x="0" y="-137.59">A</text><circle class="n" cx="-106.16" cy="61.29" r="2.6"/><text class="t" x="-120.87" y="58.35">B</text><circle class="n" cx="106.16" cy="61.29" r="2.6"/><text class="t" x="120.87" y="58.35">C</text><circle class="n" cx="-57.17" cy="108.44" r="2.6"/><text class="t" x="-65.49" y="120.92">P</text></svg>
