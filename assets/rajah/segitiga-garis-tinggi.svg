<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22.18 -232 282.35 259.37" width="282.35" height="259.37" role="img" aria-label="Segitiga ABC dengan alas BC mendatar. Sisi AB panjangnya 13, sisi AC panjangnya 15, dan alas BC panjangnya 14. Dari puncak A ditarik garis tinggi ke alas, memotongnya tegak lurus di titik D yang terletak di antara B dan C, tetapi bukan di titik tengahnya"><title>Segitiga ABC dengan alas BC mendatar. Sisi AB panjangnya 13, sisi AC panjangnya 15, dan alas BC panjangnya 14. Dari puncak A ditarik garis tinggi ke alas, memotongnya tegak lurus di titik D yang terletak di antara B dan C, tetapi bukan di titik tengahnya</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="g" points="85,-204 0,0 238,0"/><line class="g bantu putus" x1="85" y1="-204" x2="85" y2="0"/><polyline class="g" points="74,0 74,-11 85,-11"/><text class="t ukur" x="29.58" y="-107.38">13</text><text class="t ukur" x="172.7" y="-110.4">15</text><text class="t ukur" x="119" y="14">14</text><circle class="n" cx="85" cy="-204" r="2.6"/><text class="t" x="85" y="-219">A</text><circle class="n" cx="0" cy="0" r="2.6"/><text class="t" x="-13.93" y="5.57">B</text><circle class="n" cx="238" cy="0" r="2.6"/><text class="t" x="251.93" y="5.57">C</text><circle class="n" cx="85" cy="0" r="2.6"/><text class="t" x="80.69" y="14.37">D</text></svg>
