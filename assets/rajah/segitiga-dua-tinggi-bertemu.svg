<svg xmlns="http://www.w3.org/2000/svg" viewBox="-21.67 -244.17 315.33 271.54" width="315.33" height="271.54" role="img" aria-label="Segitiga ABC lancip dengan alas BC mendatar, B di kiri bawah, C di kanan bawah, dan puncak A di atas. Dari A ditarik garis tinggi ke alas, memotongnya tegak lurus di titik D di antara B dan C. Dari B ditarik garis tinggi ke sisi AC, memotongnya tegak lurus di titik E. Kedua garis tinggi itu berpotongan di titik H di dalam segitiga"><title>Segitiga ABC lancip dengan alas BC mendatar, B di kiri bawah, C di kanan bawah, dan puncak A di atas. Dari A ditarik garis tinggi ke alas, memotongnya tegak lurus di titik D di antara B dan C. Dari B ditarik garis tinggi ke sisi AC, memotongnya tegak lurus di titik E. Kedua garis tinggi itu berpotongan di titik H di dalam segitiga</title><style>svg{--tinta:#16233b;--bantu:#8894a8;--tekan:#be3a2b;--isi:#16233b}@media(prefers-color-scheme:dark){svg{--tinta:#e9edf3;--bantu:#7f8da0;--tekan:#ee7466;--isi:#e9edf3}}.g{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.g.bantu{stroke:var(--bantu);stroke-width:1.2}.g.tekan{stroke:var(--tekan);stroke-width:2}.g.putus{stroke-dasharray:5 4}.n{fill:var(--tinta);stroke:none}.n.bantu{fill:var(--bantu)}.n.tekan{fill:var(--tekan)}.a{fill:var(--isi);opacity:.09;stroke:none}.a.tekan{fill:var(--tekan);opacity:.14}.t{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15px;fill:var(--tinta);stroke:none;text-anchor:middle;dominant-baseline:central}.t.bantu{fill:var(--bantu);font-size:13px}.t.tekan{fill:var(--tekan)}.t.ukur{font-style:normal;font-size:13px}</style><polygon class="g" points="114.94,-216.17 0,0 272,0"/><line class="g bantu" x1="114.94" y1="-216.17" x2="114.94" y2="0"/><line class="g bantu" x1="0" y1="0" x2="178.03" y2="-129.34"/><polyline class="g" points="114.94,-11 125.94,-11 125.94,0"/><polyline class="g" points="169.13,-122.88 162.66,-131.78 171.56,-138.24"/><circle class="n" cx="114.94" cy="-216