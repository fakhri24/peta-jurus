name: Bangun konten

# Setiap dorongan yang menyentuh tulisan di konten/ dibangun ulang jadi data/*.json
# beserta assets/rajah/*.svg, lalu hasilnya dikomit balik. Jadi tidak ada yang perlu
# ingat menjalankan scripts/build.py sebelum push.

on:
  push:
    branches: [main]
    paths:
      - 'konten/**'
      - 'scripts/build.py'
      # Pustaka rajah ikut, karena mengubahnya mengubah keluaran SVG setiap rajah —
      # tanpa baris ini, memperbaiki satu penanda sudut tidak pernah sampai ke situs.
      - 'scripts/rajah.py'
      - 'scripts/periksa-rumus.js'
      - '.github/workflows/build-konten.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Jalankan tes
        run: python3 tests/test_build.py

      - name: Bangun data
        run: python3 scripts/build.py

      # Dijalankan setelah build, karena yang diperiksa hasilnya. Rumus yang salah
      # ketik lolos build.py tanpa keluhan dan baru terlihat sebagai kotak merah di
      # layar siswa — di sini ia menggagalkan alur, jadi tidak pernah sampai ke sana.
      - name: Periksa seluruh rumus bisa dirender KaTeX
        run: node scripts/periksa-rumus.js

      # assets/rajah/ ikut diperiksa dan dikomit, bukan hanya data/. Rajah dibangkitkan
      # build.py juga, jadi kalau hanya data/ yang dikomit, soal geometri akan merujuk
      # berkas SVG yang tidak pernah ada di repo — dan soal geometri tanpa bangunnya
      # bukan soal yang lebih sulit, melainkan soal yang tidak bisa dikerjakan.
      - name: Komit kalau ada yang berubah
        run: |
          if [ -n "$(git status --porcelain data/ assets/rajah/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ assets/rajah/
            git commit -m "Bangun ulang data dan rajah dari konten/"
            git push
          else
            echo "data/ dan assets/rajah/ sudah sesuai — tidak ada yang dikomit."
          fi
